# Weekly live check: test/live.canary.mjs calls the real upstream API, so a changed or broken
# upstream is caught within a week instead of by a user. A failure shows red on the Actions page.
name: Canary

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: node --test test/live.canary.mjs
